<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RewriteNicely</title>
  <meta name="description" content="Minimalist, browser-native text rewriter powered by on-device AI.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="state-probing">
  <div class="ambient-glow" aria-hidden="true"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
        </div>
        <div class="brand-info">
          <h1 class="brand-title">RewriteNicely</h1>
          <span class="status-indicator" id="statusIndicator">
            <span class="status-dot"></span>
            <span id="statusText">Checking browser AI...</span>
          </span>
        </div>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace-card">
      <!-- Local Model Toggle (Shown only if native AI is not supported) -->
      <section class="local-model-section" id="localModelSection" style="display: none;">
        <div class="toggle-row">
          <label class="switch-control" for="chkLocalModel">
            <input type="checkbox" id="chkLocalModel">
            <span class="switch-track">
              <span class="switch-thumb"></span>
            </span>
            <span class="switch-label">Load Local AI Model (SmolLM2-135M GGUF)</span>
          </label>
          <span class="model-badge" id="modelBadge">Local File</span>
        </div>

        <div class="progress-wrap" id="progressWrap" style="display: none;">
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
          </div>
          <div class="progress-info" id="progressInfo">Loading local model into memory...</div>
        </div>
      </section>

      <!-- Input Section -->
      <div class="input-section">
        <label for="inputText" class="section-label">Your Draft</label>
        <textarea id="inputText" class="text-area" rows="4" placeholder="Type or paste text you want to rewrite nicely...">send me the budget report right now or else</textarea>
        
        <div class="input-actions">
          <button id="btnSample" class="btn-secondary" type="button">Insert Sample</button>
          <button id="btnRewrite" class="btn-primary" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            Rewrite Nicely
          </button>
        </div>
      </div>

      <!-- Output Section -->
      <div class="output-section">
        <div class="output-header">
          <label class="section-label">Polished Output</label>
          <button id="btnCopy" class="btn-copy" type="button" title="Copy to clipboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="copy-icon">
              <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
            </svg>
            <span id="copyBtnText">Copy</span>
          </button>
        </div>

        <div class="output-box" id="outputBox">
          <p class="placeholder-text">Your polished, professional rewrite will appear here.</p>
        </div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
